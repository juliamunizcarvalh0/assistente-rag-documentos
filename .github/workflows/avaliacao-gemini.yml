name: Avaliação com Gemini

# Roda só quando disparada manualmente (aba Actions → "Run workflow"),
# para não gastar a cota gratuita do Gemini a cada push.
on:
  workflow_dispatch:

jobs:
  avaliar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Avaliação (busca sem IA + reescrita pelo Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PYTHONPATH=src python -m rag.evaluate --gemini >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio-avaliacao
          path: reports/
